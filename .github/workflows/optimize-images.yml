name: Auto-Optimize New Portraits (Sharp WebP)

on:
  push:
    branches: [main]
    paths:
      - 'images/portraits/*.jpg'
      - 'images/portraits/*.jpeg'
      - 'images/portraits/*.png'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  optimize-images:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate WebP thumbnails & fullscreen masters
        run: npm run optimize:images

      - name: Commit optimized WebP assets
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'chore(images): auto-generate optimized WebP portraits'
          file_pattern: 'images/portraits/thumbs/*.webp images/portraits/full/*.webp images/badstyle_about.webp data/portraits.json'
