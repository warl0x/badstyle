name: Weekly Boudoir Blog Feed Sync

on:
  schedule:
    # Runs every Monday at 09:00 UTC
    - cron: '0 9 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape-blog:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Boudoir RSS Scraper
        run: npm run scrape:blog

      - name: Commit updated blog feed
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'chore(blog): weekly boudoir RSS feed update'
          file_pattern: 'data/blog_feed.json'
